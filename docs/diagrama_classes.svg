    <text x="16" y="64" font-size="14">name</text>
    <text x="16" y="90" font-size="14">city, state</text>
  </g>
  <g transform="translate(470 540)">
    <rect class="box" width="240" height="110" rx="8"/>
    <rect class="head" width="240" height="36" rx="8"/>
    <text x="120" y="24" text-anchor="middle" font-weight="700">Stock</text>
    <text x="16" y="64" font-size="14">quantity</text>
    <text x="16" y="90" font-size="14">unit + product</text>
  </g>
  <path class="line" d="M290 170 H470"/>
  <text x="375" y="158" font-size="13">1:N</text>
  <path class="line" d="M710 170 H870"/>
