    <text x="16" y="64" font-size="14">canal_pedido</text>
    <text x="16" y="90" font-size="14">status</text>
    <text x="16" y="116" font-size="14">total_cents</text>
    <text x="16" y="142" font-size="14">cancellable?()</text>
  </g>
  <g transform="translate(870 95)">
    <rect class="box" width="220" height="140" rx="8"/>
