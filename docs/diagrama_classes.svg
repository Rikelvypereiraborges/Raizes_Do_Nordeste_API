    <text x="16" y="64" font-size="14">name</text>
    <text x="16" y="90" font-size="14">price_cents</text>
    <text x="16" y="116" font-size="14">active</text>
  </g>
  <g transform="translate(70 520)">
    <rect class="box" width="220" height="120" rx="8"/>
    <rect class="head" width="220" height="36" rx="8"/>
