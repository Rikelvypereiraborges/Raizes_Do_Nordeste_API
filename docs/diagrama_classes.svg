    <text x="110" y="24" text-anchor="middle" font-weight="700">Payment</text>
    <text x="16" y="64" font-size="14">status</text>
    <text x="16" y="90" font-size="14">provider</text>
    <text x="16" y="116" font-size="14">amount_cents</text>
  </g>
  <g transform="translate(470 340)">
    <rect class="box" width="240" height="150" rx="8"/>
    <rect class="head" width="240" height="36" rx="8"/>
    <text x="120" y="24" text-anchor="middle" font-weight="700">OrderItem</text>
    <text x="16" y="64" font-size="14">quantity</text>
    <text x="16" y="90" font-size="14">unit_price_cents</text>
    <text x="16" y="116" font-size="14">total_cents</text>
  </g>
  <g transform="translate(870 340)">
    <rect class="box" width="220" height="140" rx="8"/>
    <rect class="head" width="220" height="36" rx="8"/>
