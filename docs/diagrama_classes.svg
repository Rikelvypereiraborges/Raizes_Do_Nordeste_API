<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720">
  <rect width="1160" height="720" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #0f172a; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
    .head { fill: #e0f2fe; stroke: #334155; stroke-width: 2; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
  </style>
  <text x="580" y="42" text-anchor="middle" font-size="26" font-weight="700">Classes de Dominio</text>
  <g transform="translate(70 95)">
    <rect class="box" width="220" height="150" rx="8"/>
    <rect class="head" width="220" height="36" rx="8"/>
    <text x="110" y="24" text-anchor="middle" font-weight="700">User</text>
    <text x="16" y="64" font-size="14">name, email, role</text>
    <text x="16" y="90" font-size="14">admin?()</text>
    <text x="16" y="116" font-size="14">gerente?()</text>
  </g>
  <g transform="translate(470 95)">
    <rect class="box" width="240" height="170" rx="8"/>
    <rect class="head" width="240" height="36" rx="8"/>
