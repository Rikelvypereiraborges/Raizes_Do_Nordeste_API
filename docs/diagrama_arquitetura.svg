<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #0f172a; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
    .api { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .app { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .domain { fill: #fef9c3; stroke: #a16207; stroke-width: 2; }
    .infra { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="550" y="44" text-anchor="middle" font-size="26" font-weight="700">Arquitetura</text>
  <rect class="box" x="60" y="110" width="210" height="110" rx="10"/>
  <text x="165" y="152" text-anchor="middle" font-size="18" font-weight="700">Clientes</text>
  <text x="165" y="182" text-anchor="middle" font-size="14">App, Web, Totem</text>
  <rect class="api" x="350" y="90" width="260" height="150" rx="10"/>
  <text x="480" y="130" text-anchor="middle" font-size="18" font-weight="700">API</text>
  <text x="480" y="162" text-anchor="middle" font-size="14">Controllers</text>
  <text x="480" y="188" text-anchor="middle" font-size="14">Auth, permissoes</text>
  <text x="480" y="214" text-anchor="middle" font-size="14">JSON / OpenAPI</text>
  <rect class="app" x="720" y="90" width="260" height="150" rx="10"/>
  <text x="850" y="130" text-anchor="middle" font-size="18" font-weight="700">Aplicacao</text>
  <text x="850" y="162" text-anchor="middle" font-size="14">Orders::Creator</text>
  <text x="850" y="188" text-anchor="middle" font-size="14">Stocks::Mover</text>
  <text x="850" y="214" text-anchor="middle" font-size="14">Payments::MockProcessor</text>
  <rect class="domain" x="350" y="350" width="260" height="150" rx="10"/>
  <text x="480" y="390" text-anchor="middle" font-size="18" font-weight="700">Dominio</text>
  <text x="480" y="422" text-anchor="middle" font-size="14">User, Unit, Product</text>
  <text x="480" y="448" text-anchor="middle" font-size="14">Stock, Order, Payment</text>
  <text x="480" y="474" text-anchor="middle" font-size="14">Validacoes</text>
  <rect class="infra" x="720" y="350" width="260" height="150" rx="10"/>
  <text x="850" y="390" text-anchor="middle" font-size="18" font-weight="700">Infraestrutura</text>
  <text x="850" y="422" text-anchor="middle" font-size="14">SQLite</text>
  <text x="850" y="448" text-anchor="middle" font-size="14">Migrations e seeds</text>
  <text x="850" y="474" text-anchor="middle" font-size="14">Audit logs</text>
  <path class="line" d="M270 165 H350"/>
  <path class="line" d="M610 165 H720"/>
  <path class="line" d="M850 240 V350"/>
  <path class="line" d="M720 425 H610"/>
  <path class="line" d="M480 350 V240"/>
</svg>
