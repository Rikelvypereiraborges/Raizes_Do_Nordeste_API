<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700">
  <rect width="1180" height="700" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #0f172a; }
    .lane { fill: #f8fafc; stroke: #cbd5e1; }
    .step { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .decision { fill: #fef9c3; stroke: #a16207; stroke-width: 2; }
    .end { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .bad { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="590" y="42" text-anchor="middle" font-size="26" font-weight="700">Fluxo Critico - Pedido e Pagamento</text>
  <rect class="lane" x="40" y="80" width="260" height="580"/>
  <rect class="lane" x="300" y="80" width="260" height="580"/>
  <rect class="lane" x="560" y="80" width="260" height="580"/>
  <rect class="lane" x="820" y="80" width="340" height="580"/>
  <text x="170" y="112" text-anchor="middle" font-weight="700">Cliente</text>
  <text x="430" y="112" text-anchor="middle" font-weight="700">API</text>
  <text x="690" y="112" text-anchor="middle" font-weight="700">Banco</text>
  <text x="990" y="112" text-anchor="middle" font-weight="700">Pagamento mock</text>
  <rect class="step" x="80" y="150" width="180" height="54" rx="8"/>
  <text x="170" y="183" text-anchor="middle">Login</text>
  <rect class="step" x="340" y="150" width="180" height="54" rx="8"/>
  <text x="430" y="183" text-anchor="middle">Gera token</text>
  <rect class="step" x="80" y="260" width="180" height="54" rx="8"/>
  <text x="170" y="293" text-anchor="middle">Cria pedido</text>
  <rect class="decision" x="340" y="250" width="180" height="74" rx="8"/>
  <text x="430" y="280" text-anchor="middle">Valida canal</text>
  <text x="430" y="302" text-anchor="middle">e estoque</text>
  <rect class="step" x="600" y="260" width="180" height="54" rx="8"/>
  <text x="690" y="293" text-anchor="middle">Salva pedido</text>
  <rect class="step" x="600" y="365" width="180" height="54" rx="8"/>
  <text x="690" y="398" text-anchor="middle">Baixa estoque</text>
  <rect class="step" x="80" y="470" width="180" height="54" rx="8"/>
  <text x="170" y="503" text-anchor="middle">Paga pedido</text>
  <rect class="decision" x="860" y="455" width="260" height="84" rx="8"/>
  <text x="990" y="489" text-anchor="middle">Token aprovado</text>
  <text x="990" y="512" text-anchor="middle">ou negado</text>
  <rect class="end" x="600" y="560" width="180" height="54" rx="8"/>
  <text x="690" y="593" text-anchor="middle">Status pago</text>
  <rect class="bad" x="860" y="560" width="260" height="54" rx="8"/>
  <text x="990" y="593" text-anchor="middle">Status pagamento_negado</text>
  <path class="line" d="M260 177 H340"/>
  <path class="line" d="M430 204 V250"/>
  <path class="line" d="M260 287 H340"/>
  <path class="line" d="M520 287 H600"/>
  <path class="line" d="M690 314 V365"/>
  <path class="line" d="M260 497 H860"/>
  <path class="line" d="M990 539 V560"/>
  <path class="line" d="M860 587 H780"/>
</svg>
